name: Publish scaffold package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Match release tag to package
        run: |
          version="$(bun -p "require('./packages/create-pageowl/package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            git ls-remote --exit-code --tags origin "refs/tags/v$version"
          fi
      - name: Verify scaffold
        run: bun run scripts/create-pageowl-e2e.ts
      - name: Publish to GitHub Packages
        working-directory: packages/create-pageowl
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun publish --registry=https://npm.pkg.github.com --tolerate-republish
